[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Always check for a newer version of the app page, so phones don't keep showing an old copy after an update.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
