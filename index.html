<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CTM Quoting &amp; CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14222b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* Layout: app shell. Sticky top bar with tabs on wide screens, bottom tab bar on phones; one working column of panels. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#f6f8f9; --line:#d5dde1; --fg:#14222b; --muted:#5b6b75;
  --accent:#0a6a94; --accent-ink:#ffffff; --accent-soft:#e1eff6;
  --ok:#1f7a4d; --ok-soft:#e2f2e9; --warn:#a35f00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe3e1;
  --stripe:#f2c400; --bar:#14222b; --bar-ink:#eef2f3;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --surface:#16222a; --surface-2:#1b2a33; --line:#2a3b46; --fg:#e4ecf0; --muted:#97a8b2;
  --accent:#4fb3de; --accent-ink:#06202c; --accent-soft:#16384a;
  --ok:#5cc98f; --ok-soft:#173527; --warn:#f0b250; --warn-soft:#3a2a10; --bad:#f2817a; --bad-soft:#3d1a18;
  --stripe:#f2c400; --bar:#0a1115; --bar-ink:#e4ecf0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f171c; --surface:#16222a; --surface-2:#1b2a33; --line:#2a3b46; --fg:#e4ecf0; --muted:#97a8b2;
  --accent:#4fb3de; --accent-ink:#06202c; --accent-soft:#16384a;
  --ok:#5cc98f; --ok-soft:#173527; --warn:#f0b250; --warn-soft:#3a2a10; --bad:#f2817a; --bad-soft:#3d1a18;
  --stripe:#f2c400; --bar:#0a1115; --bar-ink:#e4ecf0; color-scheme:dark }
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .mark{width:28px;height:28px;border-radius:6px;background:repeating-linear-gradient(-45deg,var(--stripe) 0 6px,var(--bar) 6px 12px);border:2px solid var(--stripe)}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{background:none;border:0;color:inherit;opacity:.72;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px}
.tab:hover{opacity:1;background:rgba(127,127,127,.18)}
.tab[aria-current="page"]{opacity:1;background:var(--stripe);color:#14222b}
.tab .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-family:var(--f-mono)}
.tab svg{width:18px;height:18px}
@media (max-width:820px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--bar);justify-content:space-around;gap:0;
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-top:3px solid var(--stripe)}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;min-width:0}
  main{padding-bottom:96px!important}
}

main{max-width:1100px;margin:0 auto;padding-block:22px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel > h2,.panel > h3{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:700;margin-top:2px}
.stat .s{font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;text-align:right;white-space:nowrap}
.empty{color:var(--muted);padding:14px 4px;font-size:14px}

.pill{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.draft{} .pill.sent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.accepted,.pill.paid,.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.declined{background:var(--surface-2);color:var(--muted)}
.pill.unpaid,.pill.due{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.overdue{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.job{background:var(--accent-soft);color:var(--accent);border-color:transparent}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);font-weight:400;font-size:15px;min-width:0}
textarea{min-height:70px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fields .wide{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}

.line{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2);display:grid;gap:10px;grid-template-columns:2fr 1.6fr 1fr auto;align-items:end}
.line .calc{font-size:12.5px;color:var(--muted);grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap}
.line .calc b{font-family:var(--f-mono);color:var(--fg);font-weight:500}
@media (max-width:640px){.line{grid-template-columns:1fr 1fr}.line .wide-sm{grid-column:1/-1}}
.totals{margin-left:auto;min-width:240px;display:grid;grid-template-columns:1fr auto;gap:4px 18px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.totals .big{font-family:var(--f-display);font-size:24px;font-weight:700}

/* paper preview */
.paper{background:#fff;color:#14222b;border-radius:6px;border:1px solid var(--line);padding:28px;max-width:760px;width:100%;margin:0 auto;box-shadow:0 1px 0 rgba(0,0,0,.04);overflow-x:auto}
.paper .ph{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:4px solid #14222b;padding-bottom:12px}
.paper .ph img{max-height:64px;max-width:180px}
.paper h1{font-size:34px;color:#14222b}
.paper .meta{font-size:13px;color:#445}
.paper table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
.paper th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#556;border-bottom:1px solid #ccd;padding:6px 4px}
.paper td{padding:8px 4px;border-bottom:1px solid #e3e7ea;vertical-align:top}
.paper td.r,.paper th.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.paper .foot{margin-top:18px;font-size:13px;color:#445;white-space:pre-wrap}
.paper .tot{margin:14px 0 0 auto;width:min(100%,280px);display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-family:var(--f-mono);font-size:14px}
.paper .tot .g{font-weight:700;font-size:17px;border-top:2px solid #14222b;padding-top:4px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:center;padding:4px 0}
.cal .day{min-height:86px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.cal .day.out{opacity:.45}
.cal .day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .day.sel{background:var(--accent-soft)}
.cal .dn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cal .ev{font-size:11px;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.job{background:var(--accent-soft);color:var(--accent)} .ev.fu{background:var(--warn-soft);color:var(--warn)} .ev.inv{background:var(--bad-soft);color:var(--bad)}
@media (max-width:640px){.cal .day{min-height:54px}.cal .ev{font-size:0;height:6px;padding:0}}

.banner{border-radius:var(--r);padding:10px 14px;font-size:14px;background:var(--warn-soft);color:var(--warn);border:1px solid transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);padding:8px 10px;border-radius:8px;font-weight:600}
.searchbar{display:flex;gap:8px;flex-wrap:wrap}
.searchbar input{flex:1;min-width:180px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.svc{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.svc:first-child{border-top:0}
.svc .prop{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
@media (max-width:640px){.svc{grid-template-columns:1fr 1fr}.svc .nm{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="mark" aria-hidden="true"></span><span>CTM <small>Quotes &amp; customers</small></span></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main id="app"><div class="panel"><h2>Loading your jobs and customers…</h2><p class="hint">Your quotes, customers, calendar and invoices appear here once they load.</p></div></main>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g, ".")); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const gbp = n => (n < 0 ? "-" : "") + "£" + Math.abs(r2(n || 0)).toLocaleString("en-GB", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const parseISO = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const fmtDate = s => s ? parseISO(s).toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"}) : "";
const fmtLong = s => s ? parseISO(s).toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"}) : "";
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

/* Measurement sums: "5x4 + 2.5x3 + 10" -> 36.5 */
function measure(expr){
  const s = String(expr || "").toLowerCase().replace(/×|\*/g, "x").replace(/,/g, ".").replace(/m²|m2|sqm|m\b/g, "");
  if (!s.trim()) return 0;
  return r2(s.split("+").reduce((sum, term) => {
    const parts = term.split("x").map(p => p.trim()).filter(Boolean);
    if (!parts.length) return sum;
    return sum + parts.reduce((p, x) => p * num(x), 1);
  }, 0));
}

const UNITS = {m2: "per m²", m: "per metre", item: "per item", fixed: "fixed price", property: "by property type"};
const PROPS = [["terraced","Terraced"],["semi","Semi-detached"],["detached","Detached"],["bungalow","Bungalow"]];
const PROP_LABEL = Object.fromEntries(PROPS);
const SOURCES = ["Facebook ad","Instagram ad","Facebook","Google","Word of mouth","Leaflet","Van signage","Checkatrade","Nextdoor","Website","Repeat customer","Other"];

/* ---------- store ---------- */
const COLS = ["customers","quotes","invoices","jobs","services","settings"];
const S = {customers:{}, quotes:{}, invoices:{}, jobs:{}, services:{}, settings:{}};
let store = null, loaded = new Set(), connected = false, readOnly = false;

let sb = null, me = null;
async function initStore(){
  const cfg = window.CTM_CONFIG || {};
  if (!window.supabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey){
    $("#app").innerHTML = `<div class="panel"><h2>Almost there</h2><p>The database isn't set up yet. Add your Supabase details to <code>config.js</code>.</p></div>`; return;
  }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const {data} = await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "SIGNED_OUT") { location.reload(); }
    if (ev === "SIGNED_IN" && !me && session) { me = session.user; startData(); }
  });
  if (data.session) { me = data.session.user; startData(); } else { showLogin(); }
}
async function startData(){
  connected = true;
  store = {
    set: async (c, id, data) => { const {error} = await sb.from("records").upsert({user_id: me.id, col: c, id, data, updated_at: new Date().toISOString()}, {onConflict: "user_id,col,id"}); if (error) throw error; },
    del: async (c, id) => { const {error} = await sb.from("records").delete().match({user_id: me.id, col: c, id}); if (error) throw error; }
  };
  const fresh = {customers:{}, quotes:{}, invoices:{}, jobs:{}, services:{}, settings:{}};
  for (let from = 0; ; from += 1000){
    const {data, error} = await sb.from("records").select("col,id,data").range(from, from + 999);
    if (error) { $("#app").innerHTML = `<div class="panel"><h2>Couldn't load your data</h2><p>${esc(error.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`; return; }
    data.forEach(r => { if (fresh[r.col]) fresh[r.col][r.id] = Object.assign({id: r.id}, r.data); });
    if (data.length < 1000) break;
  }
  COLS.forEach(c => { S[c] = fresh[c]; loaded.add(c); });
  onData();
  sb.channel("records-" + me.id).on("postgres_changes", {event: "*", schema: "public", table: "records", filter: "user_id=eq." + me.id}, p => {
    const r = p.eventType === "DELETE" ? p.old : p.new; if (!r || !S[r.col]) return;
    if (p.eventType === "DELETE") delete S[r.col][r.id]; else S[r.col][r.id] = Object.assign({id: r.id}, r.data);
    onData();
  }).subscribe();
}
function showLogin(mode){
  mode = mode || "in";
  $("#tabs").innerHTML = "";
  $("#app").innerHTML = `<section class="panel" style="max-width:420px;margin:30px auto;width:100%"><h1>${mode === "in" ? "Sign in" : "Create your account"}</h1>
    <p class="hint" style="font-size:14px">${mode === "in" ? "Your quotes, customers and invoices are private to your account." : "Set up the account you'll use on your phone and laptop."}</p>
    <form id="login" class="fields" style="grid-template-columns:1fr;margin-top:12px">
      <label class="f">Email<input type="email" id="l-email" autocomplete="email" required></label>
      <label class="f">Password<input type="password" id="l-pass" autocomplete="${mode === "in" ? "current-password" : "new-password"}" minlength="8" required style="width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px"></label>
      <button class="btn primary" type="submit">${mode === "in" ? "Sign in" : "Create account"}</button>
      <p class="hint" id="l-msg"></p>
      <button class="btn ghost sm" type="button" id="l-switch">${mode === "in" ? "First time? Create your account" : "Already have an account? Sign in"}</button>
      ${mode === "in" ? `<button class="btn ghost sm" type="button" id="l-reset">Forgot password</button>` : ""}
    </form></section>`;
  $("#l-switch").onclick = () => showLogin(mode === "in" ? "up" : "in");
  if ($("#l-reset")) $("#l-reset").onclick = async () => { const e = $("#l-email").value.trim(); if (!e) { $("#l-msg").textContent = "Type your email first."; return; } await sb.auth.resetPasswordForEmail(e, {redirectTo: location.origin}); $("#l-msg").textContent = "Check your email for a reset link."; };
  $("#login").onsubmit = async ev => {
    ev.preventDefault(); const email = $("#l-email").value.trim(), password = $("#l-pass").value;
    $("#l-msg").textContent = "One moment…";
    const res = mode === "in" ? await sb.auth.signInWithPassword({email, password}) : await sb.auth.signUp({email, password});
    if (res.error) { $("#l-msg").textContent = res.error.message; return; }

/* ---------- money ---------- */
function lineAmount(l){
  let base = 0, qty = 0;
  if (l.unit === "property") base = num(l.propRate);
  else if (l.unit === "fixed") base = num(l.rate);
  else { qty = l.unit === "item" ? num(l.measure) : measure(l.measure); base = qty * num(l.rate); }
  let amount = base, minApplied = false;
  if (num(l.min) > 0 && base > 0 && base < num(l.min)){ amount = num(l.min); minApplied = true; }
  if (l.override !== "" && l.override != null && !isNaN(parseFloat(l.override))) amount = num(l.override);
  return {qty: r2(qty), base: r2(base), amount: r2(amount), minApplied};
}
function totals(doc){
  const lines = doc.lines || [];
  const sub = r2(lines.reduce((s, l) => s + lineAmount(l).amount, 0));
  const disc = r2(Math.min(num(doc.discount), sub));
  const vatOn = doc.vatOn != null ? doc.vatOn : biz().vatOn;
  const vatRate = doc.vatRate != null ? num(doc.vatRate) : num(biz().vatRate);
  const net = r2(sub - disc);
  const vat = vatOn ? r2(net * vatRate / 100) : 0;
  return {sub, disc, net, vat, vatOn, vatRate, total: r2(net + vat)};
}
function lineText(l){
  const a = lineAmount(l);
  if (l.unit === "property") return PROP_LABEL[l.propType] || "";
  if (l.unit === "fixed") return "";
  if (l.unit === "item") return a.qty + " × " + gbp(num(l.rate));
  const u = l.unit === "m2" ? "m²" : "m";
  return a.qty + " " + u + " @ " + gbp(num(l.rate)) + "/" + u + (a.minApplied ? " (minimum charge)" : "");
}

// The website's /api/freeagent function talks to FreeAgent. It hands back a sealed
// token, which we keep in settings (doc "freeagent") and send with each request.
const fa = () => Object.assign({autoSend: true}, S.settings.freeagent || {});
let faStarted = false, faReturn = null, faBusy = new Set();
(function readFreeAgentReturn(){
  const h = new URLSearchParams((location.hash || "").slice(1));
  if (!h.has("fa") && !h.has("fa_error")) return;
  faReturn = {token: h.get("fa"), state: h.get("state"), error: h.get("fa_error")};
  try { history.replaceState(null, "", location.pathname + "#business"); } catch (e) {}
})();
async function faCall(action, body){
  const res = await fetch("/api/freeagent", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(Object.assign({action, token: fa().token}, body || {}))});
  const j = await res.json().catch(() => ({error: "The website couldn't reach FreeAgent. Try again in a minute."}));
  if (j.token) await put("settings", Object.assign({}, fa(), {id: "freeagent", token: j.token}));
  if (!res.ok) { const e = new Error(j.error || "FreeAgent didn't respond."); e.status = res.status; throw e; }
  return j;
}
function faConnect(){
  const state = uid() + uid();
  try { sessionStorage.setItem("faState", state); } catch (e) {}
  location.href = "/api/freeagent?start=" + encodeURIComponent(state);
}
async function faStartup(){
  if (faReturn) {
    const r = faReturn; faReturn = null; let expected = null;
    try { expected = sessionStorage.getItem("faState"); sessionStorage.removeItem("faState"); } catch (e) {}
    if (r.error) toast("FreeAgent: " + r.error);
    else if (r.token && expected && r.state === expected) {
      await put("settings", Object.assign({}, fa(), {id: "freeagent", token: r.token, connectedAt: new Date().toISOString()}));
      try { const {company, web} = await faCall("status"); await put("settings", Object.assign({}, fa(), {id: "freeagent", company, web})); toast("Connected to FreeAgent" + (company ? " (" + company + ")" : "")); }
      catch (e) { toast("FreeAgent: " + e.message); }
    } else toast("That FreeAgent sign-in didn't come from this app. Try Connect again.");
    go("business");
  }
  if (fa().token) faCheckPayments(true);
}
// Turn an app invoice into the plain lines FreeAgent needs.
function faInvoice(i){
  const t = totals(i);
  return {number: i.number, date: i.date, dueDate: i.dueDate, notes: i.notes, vatOn: t.vatOn, vatRate: t.vatRate, discount: t.disc,
    items: (i.lines || []).map(l => { const x = lineText(l); return {description: (l.name || "Service") + (x ? " (" + x + ")" : ""), amount: lineAmount(l).amount}; })};
}
async function faSend(id, quiet){
  const i = S.invoices[id]; if (!i || i.freeagentUrl || faBusy.has(id) || !fa().token) return;
  const c = S.customers[i.customerId]; if (!c) { toast("This invoice has no customer to send to FreeAgent."); return; }
  faBusy.add(id); if (!quiet) render();
  try {
    const r = await faCall("send", {invoice: faInvoice(i), customer: {name: c.name, email: c.email, phone: c.phone, address: c.address, postcode: c.postcode, freeagentContact: c.freeagentContact}});
    if (r.contactUrl && r.contactUrl !== c.freeagentContact) await put("customers", Object.assign({}, S.customers[c.id], {freeagentContact: r.contactUrl}));
    const sent = faRenumber(Object.assign({}, S.invoices[id], {freeagentUrl: r.invoiceUrl, freeagentSentAt: new Date().toISOString()}), r.reference); delete sent.freeagentError;
    await put("invoices", sent);
    toast("Sent to FreeAgent as " + sent.number);
  } catch (e) {
    await put("invoices", Object.assign({}, S.invoices[id], {freeagentError: e.message})).catch(() => {});
    toast("FreeAgent: " + e.message);
  } finally { faBusy.delete(id); render(); }
}
// Ask FreeAgent which of our unpaid invoices it has matched to a payment (e.g. from Mettle).
// Use FreeAgent's invoice number, keeping the app's own one as appNumber.
function faRenumber(inv, ref){
  if (!ref) return inv;
  if (ref !== inv.number) { if (!inv.appNumber) inv.appNumber = inv.number; inv.number = ref; }
  inv.freeagentRef = ref;
  return inv;
}
async function faCheckPayments(quiet){
  const open = Object.values(S.invoices).filter(i => i.freeagentUrl && (i.status !== "paid" || !i.freeagentRef));
  if (!open.length) { if (!quiet) toast("No unpaid invoices in FreeAgent to check."); return; }
  try {
    const {paid, refs = {}} = await faCall("check", {urls: open.map(i => i.freeagentUrl)});
    let n = 0, changed = false;
    for (const i of open) {
      const u = i.freeagentUrl, cur = S.invoices[i.id], ref = refs[u];
      const nowPaid = cur.status !== "paid" && paid[u];
      if (!nowPaid && (!ref || ref === cur.freeagentRef)) continue;
      const next = faRenumber(Object.assign({}, cur), ref);
      if (nowPaid) { Object.assign(next, {status: "paid", paidOn: paid[u], paidBy: "Bank transfer (FreeAgent)"}); n++; }
      await put("invoices", next); changed = true;
    }
    if (n || !quiet) toast(n ? n + " invoice" + (n > 1 ? "s" : "") + " marked paid from FreeAgent" : "No new payments in FreeAgent yet.");
    if (changed) render();
  } catch (e) { if (!quiet || e.status === 401) toast("FreeAgent: " + e.message); }
}
function faPanel(i){
  const f = fa(); if (!f.token) return "";
  const open = f.web && i.freeagentUrl ? f.web + "/invoices/" + i.freeagentUrl.split("/").pop() : "";
  if (i.freeagentUrl) return `<section class="panel"><div class="row"><span>In FreeAgent since ${fmtDate((i.freeagentSentAt || "").slice(0, 10))}${i.status !== "paid" ? ". It'll show as paid here once FreeAgent matches the payment." : "."}</span><span class="spacer"></span>${open ? `<a class="btn sm" href="${esc(open)}" target="_blank" rel="noopener">Open in FreeAgent</a>` : ""}</div>
    ${i.freeagentSentAt && i.updatedAt > i.freeagentSentAt && i.updatedAt.slice(0, 16) !== i.freeagentSentAt.slice(0, 16) && i.status !== "paid" ? `<p class="hint">If you changed the invoice after sending it, make the same change in FreeAgent.</p>` : ""}</section>`;
  return `<section class="panel"><div class="row"><span>${i.freeagentError ? "Couldn't send to FreeAgent: " + esc(i.freeagentError) : "Not in FreeAgent yet."}</span><span class="spacer"></span>
    <button class="btn primary" data-act="faSend" data-id="${i.id}" ${faBusy.has(i.id) ? "disabled" : ""}>${faBusy.has(i.id) ? "Sending…" : i.freeagentError ? "Try again" : "Send to FreeAgent"}</button></div></section>`;
}

function parseDelimited(text){
  text = text.replace(/^\uFEFF/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const delim = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? "\t" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim){ row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function decodeFile(buf){
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder("utf-16le").decode(buf);
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder("utf-16be").decode(buf);
  return new TextDecoder("utf-8").decode(buf);
}
const cleanVal = v => String(v || "").trim().replace(/^[a-z]:/, "");
function mapLeads(rows){
  const head = rows[0].map(h => h.trim().toLowerCase().replace(/\s+/g, "_"));
  const find = (...keys) => head.findIndex(h => keys.includes(h));
  const ix = {id: find("id","lead_id"), time: find("created_time","date","created"), name: find("full_name","name","full name"), first: find("first_name"), last: find("last_name"),
    phone: find("phone_number","phone","mobile","telephone"), email: find("email","email_address"), street: find("street_address","address","street"), city: find("city","town"),
    post: find("post_code","postcode","zip_code","zip","postal_code"), platform: find("platform")};
  const used = new Set(Object.values(ix).filter(i => i >= 0));
  const extra = head.map((h, i) => i).filter(i => !used.has(i) && !META_STD.has(head[i]));
  const nice = h => h.replace(/_/g, " ").replace(/\?$/, "").replace(/^./, c => c.toUpperCase());
  return rows.slice(1).map(r => {
    const g = i => i >= 0 ? cleanVal(r[i]) : "";
    let name = g(ix.name) || [g(ix.first), g(ix.last)].filter(Boolean).join(" ");
    const answers = extra.map(i => [head[i], cleanVal(r[i])]).filter(([, v]) => v);
    const svcAns = answers.find(([h]) => /service|clean|job|work|need|interest|looking/.test(h));
    const service = (svcAns ? svcAns[1] : (answers[0] || [])[1] || "").replace(/_/g, " ").replace(/^./, c => c.toUpperCase());
    const others = answers.filter(a => a !== svcAns && (svcAns || a !== answers[0]));
    const plat = g(ix.platform).toLowerCase();
    return {leadId: g(ix.id), leadDate: (g(ix.time) || "").slice(0, 10), name: name || "Unnamed lead", phone: g(ix.phone).replace(/^\+44\s?/, "0").replace(/^p:/, ""),
      email: g(ix.email), address: [g(ix.street), g(ix.city)].filter(Boolean).join(", "), postcode: g(ix.post).toUpperCase(), service,
      notes: others.map(([h, v]) => nice(h) + ": " + v.replace(/_/g, " ")).join("\n"), source: plat === "ig" || plat.includes("insta") ? "Instagram ad" : "Facebook ad"};
  });
}

/* PDF */
async function makePDF(kind, rec){
  if (!window.jspdf) { toast("The PDF tool didn't load. Reload the page and try again."); return; }
  const {jsPDF} = window.jspdf; const doc = new jsPDF({unit: "mm", format: "a4"});
  const b = biz(), c = cust(rec.customerId), t = totals(rec), W = 210, M = 16;
  let y = M;
  if (b.logo){ try { const fmt = b.logo.indexOf("image/png") > -1 ? "PNG" : "JPEG"; const p = doc.getImageProperties(b.logo); const h = 20, w = Math.min(60, p.width / p.height * h); doc.addImage(b.logo, fmt, M, y, w, h); } catch (e) { doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text(b.name, M, y + 8); } }
  else { doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text(b.name, M, y + 8); }
  doc.setFont("helvetica", "bold"); doc.setFontSize(24); doc.text(kind === "quote" ? "QUOTE" : "INVOICE", W - M, y + 8, {align: "right"});
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  const metaR = [rec.number, kind === "quote" ? "Date: " + fmtLong(rec.date) : "Issued: " + fmtLong(rec.date), kind === "quote" ? "Valid until: " + fmtLong(addDays(rec.date, num(b.validDays) || 30)) : "Due: " + fmtLong(rec.dueDate)];
  doc.text(metaR, W - M, y + 15, {align: "right"});
  const from = [b.address, b.phone, b.email, b.website].filter(Boolean).join("\n").split("\n");
  doc.text(from, M, y + 26);
  y = Math.max(y + 26 + from.length * 4.5, y + 34) + 2;
  doc.setDrawColor(20, 34, 43); doc.setLineWidth(1); doc.line(M, y, W - M, y); y += 8;
  doc.setFont("helvetica", "bold"); doc.text(kind === "quote" ? "Prepared for" : "Bill to", M, y); doc.setFont("helvetica", "normal");
  const to = [c.name, c.address, c.postcode].filter(Boolean); doc.text(to, M, y + 5); y += 5 + to.length * 4.5 + 4;
  const body = (rec.lines || []).map(l => { const d = [lineText(l), l.note].filter(Boolean).join("\n"); return [l.name + (d ? "\n" + d : ""), gbp(lineAmount(l).amount)]; });
  doc.autoTable({startY: y, head: [["Description", "Amount"]], body, margin: {left: M, right: M}, theme: "plain",
    headStyles: {fontStyle: "bold", textColor: [80, 90, 100], fontSize: 9, lineWidth: {bottom: 0.3}, lineColor: [200, 205, 210]},
    bodyStyles: {fontSize: 10, cellPadding: 2.5, lineWidth: {bottom: 0.2}, lineColor: [225, 230, 233]}, columnStyles: {1: {halign: "right", cellWidth: 35}}});
  y = doc.lastAutoTable.finalY + 6;
  const rows = [["Subtotal", gbp(t.sub)]]; if (t.disc) rows.push(["Discount", "-" + gbp(t.disc)]); if (t.vatOn) rows.push(["VAT " + t.vatRate + "%", gbp(t.vat)]);
  rows.forEach(([k, v]) => { doc.text(k, W - M - 60, y); doc.text(v, W - M, y, {align: "right"}); y += 5.5; });
  doc.setLineWidth(0.6); doc.line(W - M - 60, y - 2, W - M, y - 2); y += 4; doc.setFont("helvetica", "bold"); doc.setFontSize(13);
  doc.text("Total", W - M - 60, y); doc.text(gbp(t.total), W - M, y, {align: "right"}); doc.setFont("helvetica", "normal"); doc.setFontSize(10); y += 10;
  const foot = [];
  foot.push(t.vatOn ? (b.vatNo ? "VAT number: " + b.vatNo : "") : "No VAT charged.");
  if (rec.notes) foot.push("", rec.notes);
  if (kind === "invoice" && (b.bankName || b.accountNo)) foot.push("", "Pay by bank transfer", b.bankName, b.sortCode ? "Sort code: " + b.sortCode : "", b.accountNo ? "Account: " + b.accountNo : "", "Reference: " + rec.number);
  foot.push("", kind === "quote" ? b.quoteNote : b.invoiceNote);
  const lines = doc.splitTextToSize(foot.filter(v => v != null).join("\n"), W - 2 * M);
  if (y + lines.length * 4.5 > 285) { doc.addPage(); y = M; }
  doc.text(lines, M, y);
  const blob = doc.output("blob");
  await saveFile((kind === "quote" ? "Quote " : "Invoice ") + rec.number + " - " + c.name + ".pdf", blob);
}
async function saveFile(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith(".csv") ? "text/csv" : filename.endsWith(".json") ? "application/json" : "application/octet-stream"});
  const file = new File([blob], filename, {type: blob.type || "application/pdf"});
  if (filename.endsWith(".pdf") && navigator.canShare && navigator.canShare({files: [file]}) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
    try { await navigator.share({files: [file], title: filename}); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Saved " + filename);
}

  if (!el) return;
  if (el.tagName === "A" && el.getAttribute("href") && el.getAttribute("href") !== "#" && !el.dataset.open) return;
  if (el.dataset.tab) { ev.preventDefault(); return go(el.dataset.tab); }

  if (el.dataset.if) { iFilter = el.dataset.if; return render(); }

  if (el.dataset.day) { calSel = el.dataset.day; return render(); }
  if (el.dataset.open) {
    ev.preventDefault();
    const id = el.dataset.id, o = el.dataset.open;
    if (o === "job") { jdraft = Object.assign({}, S.jobs[id]); return go("job"); }

});

  addSvc: async () => { readSvcs(); const order = Object.keys(S.services).length + 1; await put("services", {name: "New service", unit: "m2", rate: 0, min: 0, order, active: true}); render(); },
  saveSvcs: async () => { readSvcs(); for (const s of Object.values(S.services)) await put("services", s); toast("Prices saved"); render(); },
  starter: async () => { let o = 1; for (const [name, unit, rate, min, prop] of STARTER) { const s = {name, unit, rate, min, order: o++, active: true}; if (prop) s.prop = prop; await put("services", s); } toast("Starter prices loaded. Change them to yours."); render(); },
  backup: () => saveFile("CTM backup " + today() + ".json", JSON.stringify({exportedAt: new Date().toISOString(), customers: S.customers, quotes: S.quotes, invoices: S.invoices, jobs: S.jobs, services: S.services, settings: S.settings}, null, 2)),
  doImport: async () => {
    const fresh = (importRows || []).filter(l => !isDuplicate(l)); let n = 0;
    for (const l of fresh){ await put("customers", Object.assign({stage: "lead"}, l)); n++; }
    importRows = null; toast("Imported " + n + " lead" + (n === 1 ? "" : "s")); go("today");
  },
  signOut: async () => { await sb.auth.signOut(); },
  closeLead: async (el, id) => { await put("customers", Object.assign({}, S.customers[id], {stage: "closed"})); toast("Removed from new leads"); render(); },
  csv: () => {
    const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
    const rows = [["Name","Phone","Email","Address","Postcode","Source","Notes","Customer since"]].concat(Object.values(S.customers).map(c => [c.name, c.phone, c.email, c.address, c.postcode, c.source, c.notes, (c.createdAt || "").slice(0, 10)]));
    saveFile("CTM customers " + today() + ".csv", rows.map(r => r.map(q).join(",")).join("\n"));
  },
  askDel: (el, id) => {
    const kind = el.dataset.kind; pendingDel = {kind, id};
    const what = {quotes: "this quote", invoices: "this invoice", customers: "this customer (their quotes and invoices stay)", jobs: "this job", services: "this service"}[kind];
    el.parentElement.innerHTML = `<span class="confirm">Delete ${what}? <button class="btn sm danger" data-act="doDel">Delete</button><button class="btn sm" data-act="noDel">Keep</button></span>`;
  },
  noDel: () => { pendingDel = null; render(); },
  doDel: async () => {
    if (!pendingDel) return; const {kind, id} = pendingDel; pendingDel = null;
    await remove(kind, id); toast("Deleted");
    if (kind === "services") { readSvcs(); render(); } else go({quotes: "quotes", invoices: "invoices", customers: "customers", jobs: "calendar"}[kind]);
  }
};

/* ---------- boot ---------- */
window.addEventListener("online", () => connected && render()); window.addEventListener("offline", () => connected && render());
const h = (location.hash || "").slice(1);
if (TABS.some(t => t[0] === h)) view = {name: h};
renderTabs();
initStore();
})();
</script>
